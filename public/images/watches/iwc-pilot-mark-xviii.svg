<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#060606;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c0a030;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#c0a030;stop-opacity:0.3" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#c0a030" stroke-width="0.3" opacity="0.15"/>
  </pattern>
  <rect width="800" height="600" fill="url(#grid)"/>

  <!-- Watch case outer ring -->
  <circle cx="400" cy="280" r="155" fill="none" stroke="url(#ring)" stroke-width="3" opacity="0.6"/>

  <!-- Watch bezel -->
  <circle cx="400" cy="280" r="140" fill="rgba(0,0,0,0.3)" stroke="#c0a030" stroke-width="2" opacity="0.5"/>

  <!-- Watch dial -->
  <circle cx="400" cy="280" r="115" fill="rgba(0,0,0,0.4)"/>

  <!-- Hour markers -->
  <line x1="400.0" y1="180.0" x2="400.0" y2="198.0" stroke="#c0a030" stroke-width="3" opacity="0.8"/>
  <line x1="450.0" y1="193.4" x2="444.5" y2="202.9" stroke="#c0a030" stroke-width="1.5" opacity="0.8"/>
  <line x1="486.6" y1="230.0" x2="477.1" y2="235.5" stroke="#c0a030" stroke-width="1.5" opacity="0.8"/>
  <line x1="500.0" y1="280.0" x2="482.0" y2="280.0" stroke="#c0a030" stroke-width="3" opacity="0.8"/>
  <line x1="486.6" y1="330.0" x2="477.1" y2="324.5" stroke="#c0a030" stroke-width="1.5" opacity="0.8"/>
  <line x1="450.0" y1="366.6" x2="444.5" y2="357.1" stroke="#c0a030" stroke-width="1.5" opacity="0.8"/>
  <line x1="400.0" y1="380.0" x2="400.0" y2="362.0" stroke="#c0a030" stroke-width="3" opacity="0.8"/>
  <line x1="350.0" y1="366.6" x2="355.5" y2="357.1" stroke="#c0a030" stroke-width="1.5" opacity="0.8"/>
  <line x1="313.4" y1="330.0" x2="322.9" y2="324.5" stroke="#c0a030" stroke-width="1.5" opacity="0.8"/>
  <line x1="300.0" y1="280.0" x2="318.0" y2="280.0" stroke="#c0a030" stroke-width="3" opacity="0.8"/>
  <line x1="313.4" y1="230.0" x2="322.9" y2="235.5" stroke="#c0a030" stroke-width="1.5" opacity="0.8"/>
  <line x1="350.0" y1="193.4" x2="355.5" y2="202.9" stroke="#c0a030" stroke-width="1.5" opacity="0.8"/>

  <!-- Hour hand -->
  <line x1="400" y1="280" x2="400" y2="220" stroke="#c0a030" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
  <!-- Minute hand -->
  <line x1="400" y1="280" x2="435" y2="198" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <!-- Seconds hand -->
  <line x1="400" y1="295" x2="395" y2="245" stroke="#c0a030" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Center dot -->
  <circle cx="400" cy="280" r="4" fill="#c0a030"/>

  <!-- Crown -->
  <rect x="538" y="270" width="18" height="20" rx="4" fill="#c0a030" opacity="0.5"/>

  <!-- Lugs top -->
  <rect x="382" y="132" width="36" height="14" rx="5" fill="#c0a030" opacity="0.3"/>
  <!-- Lugs bottom -->
  <rect x="382" y="414" width="36" height="14" rx="5" fill="#c0a030" opacity="0.3"/>

  <!-- Brand name -->
  <text x="400" y="490" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="bold" fill="#c0a030" letter-spacing="4" opacity="0.9">IWC</text>

  <!-- Watch name -->
  <text x="400" y="525" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#94a3b8" letter-spacing="2" opacity="0.8">Pilot Mark XVIII</text>

  <!-- Decorative line -->
  <line x1="300" y1="475" x2="500" y2="475" stroke="#c0a030" stroke-width="0.5" opacity="0.4"/>
</svg>